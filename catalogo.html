<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Catálogo de Equipamentos — ANR Locações</title>
  <meta name="description" content="Catálogo completo de equipamentos para locação em Brasília. Filtre por categoria e encontre o que sua obra precisa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
  <div id="header"></div>

  <main>

      <nav class="breadcrumb">
        <a href="index.html">Início</a>

          <button class="btn btn-primary" id="searchBtn">Buscar equipamentos</button>
        </div>

        <div class="filter-chips" id="filterChips"></div>
      </header>

      <p class="result-count" id="resultCount"></p>
      <div id="catalogGrid" class="product-grid"></div>
      <nav class="pagination" id="pagination"></nav>
    </div>

    <!-- FAIXA CTA -->

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/catalogo.js"></script>

</html>
